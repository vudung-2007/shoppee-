 const nm=inp({placeholder:"VD: Bột mì",list:"ings"}),qt=inp({type:"number",min:0,step:"any",placeholder:"Số lượng"}),un=inp({placeholder:"kg, lít…",list:"units"}),co=inp({type:"number",min:0,placeholder:"Tổng tiền (VND)"}),dt=inp({type:"date",value:ymd(Date.now())}),nt=inp({placeholder:"Ghi chú (không bắt buộc)"});
 const ttl=h("h2",{},"🥚 Nhập nguyên liệu đã mua"),okB=btn("Lưu nguyên liệu",()=>submit()),cancelB=btn("Bỏ sửa",()=>clear(),"o");cancelB.hidden=true;
 const clear=()=>{eb=null;[nm,qt,un,co,nt].forEach(i=>i.value="");dt.value=ymd(Date.now());ttl.textContent="🥚 Nhập nguyên liệu đã mua";cancelB.hidden=true;okB.textContent="Lưu nguyên liệu"};
 const submit=()=>{const e=m=>toast(m,"err"),name=nm.value.trim(),qty=Number(qt.value),cost=Number(co.value),unit=un.value.trim()||"cái",at=new Date(dt.value+"T12:00").getTime();
  if(!name)return e("Nhập tên nguyên liệu nhé.");if(!(qty>0))return e("Số lượng phải lớn hơn 0.");if(co.value===""||!(cost>=0))return e("Nhập tổng tiền (không âm).");if(!Number.isFinite(at))return e("Chọn ngày mua.");
  const v={at,name,qty,unit,cost,note:nt.value.trim()};if(eb)Object.assign(S.buys.find(x=>x.id===eb),v);else S.buys.push({id:uid(),...v});
  if(save()){toast("Đã lưu 🎉");clear();draw()}};
 const box=h("div"),draw=()=>{const[a,b]=rng(f.p),bs=S.buys.filter(x=>x.at>=a&&x.at<b).sort((x,y)=>y.at-x.at),spent=bs.reduce((s,x)=>s+x.cost,0),rev=S.orders.filter(o=>o.status!=="cancel"&&o.at>=a&&o.at<b).reduce((s,o)=>s+sub(o),0),g={};
  bs.forEach(x=>{const k=x.name.toLowerCase()+"|"+x.unit.toLowerCase(),y=g[k]||(g[k]={name:x.name,unit:x.unit,qty:0,cost:0,n:0});y.qty+=x.qty;y.cost+=x.cost;y.n++});
  box.replaceChildren(h("div",{class:"cards"},card("🛒 Chi nguyên liệu",fm(spent),"big"),card("🧾 Số lần mua",bs.length),card("💰 Tiền hàng đã bán",fm(rev)),card("🌟 Lãi tạm tính",fm(rev-spent),rev-spent<0?"bad":"")),
   h("p",{class:"sub"},"Lãi tạm tính = tiền hàng (không gồm ship, không tính đơn hủy) trừ tiền nguyên liệu; chưa trừ chi phí khác."),
   h("h3",{},"Thống kê theo nguyên liệu"),tbl(["Nguyên liệu","Đã mua","Tổng tiền","Giá trung bình","Số lần"],Object.values(g).sort((x,y)=>y.cost-x.cost).map(x=>[x.name,nf(x.qty)+" "+x.unit,fm(x.cost),fm(x.cost/x.qty)+" / "+x.unit,String(x.n)]),"Chưa có nguyên liệu nào trong khoảng này."),
   h("h3",{},"Lịch sử mua"),tbl(["Ngày","Nguyên liệu","Số lượng","Tiền","Ghi chú",""],bs.map(x=>[fdd(x.at),x.name,nf(x.qty)+" "+x.unit,fm(x.cost),x.note,h("div",{class:"row",style:"margin:0;flex-wrap:nowrap"},btn("Sửa",()=>{eb=x.id;nm.value=x.name;qt.value=x.qty;un.value=x.unit;co.value=x.cost;dt.value=ymd(x.at);nt.value=x.note;ttl.textContent="✏️ Sửa nguyên liệu";cancelB.hidden=false;okB.textContent="Lưu thay đổi";scrollTo({top:0,behavior:"smooth"})},"s o"),btn("Xóa",()=>{if(confirm("Xóa lần mua "+x.name+"?")){S.buys=S.buys.filter(y=>y!==x);if(eb===x.id)clear();save();draw()}},"s d"))]),"Chưa có lần mua nào."))};
 draw();
 return h("div",{},h("datalist",{id:"ings"},[...new Set(S.buys.map(x=>x.name))].map(k=>h("option",{value:k}))),
  h("div",{class:"formbox"},ttl,h("div",{class:"g"},fld("Tên nguyên liệu *",nm),fld("Số lượng *",qt),fld("Đơn vị",un),fld("Tổng tiền (VND) *",co),fld("Ngày mua",dt),fld("Ghi chú",nt)),h("div",{class:"row"},okB,cancelB)),
  h("div",{class:"row",style:"margin-top:22px"},h("h2",{style:"margin:0;flex:1"},"📊 Thống kê"),sel(PR,f.p,v=>{f.p=v;draw()})),box)};

function render(){$("#nav").replaceChildren(...[["ord","🧾 Đơn hàng"],["ing","🥚 Nguyên liệu"]].map(([k,l])=>h("button",{class:k===page?"on":"",onclick:()=>{page=k;editId=null;render();scrollTo(0,0)}},l)));
 try{$("#main").replaceChildren(V[page](),tools())}catch(e){console.error(e);$("#main").replaceChildren(h("div",{class:"empty"},"Có lỗi hiển thị: "+e.message))}}
load();render();
</script></body></html>
